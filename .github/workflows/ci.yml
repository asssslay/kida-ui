name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The React components are tested in a real browser — layout, IntersectionObserver
      # and CSS animations have no meaningful jsdom equivalent.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @kida-ui/react exec playwright install --with-deps chromium
      - run: pnpm lint
      - name: Registry output is current and schema-valid
        run: pnpm registry:check
      - name: Copied components work as standalone consumer source
        run: pnpm registry:check-copy
      - name: Documentation examples match copied component source
        run: pnpm docs:check-examples
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: ADR D3a — framework-free core
        run: pnpm gate:agnostic
      - name: Package manifests are publishable
        run: pnpm -r --filter "./packages/*" exec publint
