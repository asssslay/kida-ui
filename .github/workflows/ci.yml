name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # This image is also the canonical renderer for checked-in visual baselines.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The React and Vue components are tested in a real browser — layout, IntersectionObserver
      # and CSS animations have no meaningful jsdom equivalent.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @kida-ui/react exec playwright install --with-deps chromium
      - run: pnpm lint
      - name: Registry output is current and schema-valid
        run: pnpm registry:check
      - name: Copied components work as standalone consumer source
        run: pnpm registry:check-copy
      - name: Documentation examples match copied component source
        run: pnpm docs:check-examples
      - run: pnpm typecheck
      - run: pnpm test
      - name: Responsive visual baselines
        run: pnpm --filter @kida-ui/react test:visual
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-differences
          path: |
            packages/react/.vitest-attachments/visual
            packages/vue/.vitest-attachments/parity
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm build
      - name: Packed Vue packages work in an isolated consumer
        run: pnpm check:vue-consumer
      - name: React and Vue documentation work in development
        run: pnpm docs:check-dev
      - name: ADR D3a — framework-free core
        run: pnpm gate:agnostic
      - name: Package manifests are publishable
        run: pnpm -r --filter "./packages/*" exec publint
